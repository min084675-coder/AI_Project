<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Luna Stage 1 - リンゴを取りに行こう</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #1e1e2e;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    color: #eee;
  }
  h1 {
    margin: 16px 0 8px;
    font-size: 20px;
  }
  #status {
    margin-bottom: 8px;
    font-size: 14px;
    color: #aaa;
    height: 20px;
  }
  canvas {
    background: #2b2b3c;
    border: 4px solid #555;
    border-radius: 8px;
  }
  #chatPanel {
    margin-top: 14px;
    width: 640px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #chatLog {
    height: 120px;
    overflow-y: auto;
    background: #16161f;
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .chat-line {
    margin-bottom: 4px;
  }
  .chat-speaker {
    font-weight: bold;
    color: #7fd3ff;
  }
  #chatForm {
    display: flex;
    gap: 8px;
  }
  #chatInput {
    flex: 1;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #16161f;
    color: #eee;
    font-size: 14px;
  }
  #chatForm button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: #7fd3ff;
    color: #1e1e2e;
    font-weight: bold;
    cursor: pointer;
  }
  #chatForm button:hover {
    background: #a3e0ff;
  }
  #serverNote {
    font-size: 12px;
    color: #777;
  }
</style>
</head>
<body>
  <h1>Stage 1: Lunaはリンゴを取りに行く</h1>
  <div id="status">準備中...</div>
  <canvas id="gameCanvas" width="640" height="480"></canvas>

  <div id="chatPanel">
    <div id="chatLog"></div>
    <form id="chatForm">
      <input id="chatInput" type="text" placeholder="Lunaに話しかける..." autocomplete="off" />
      <button type="submit">送信</button>
    </form>
    <div id="serverNote">※ server.py (python server.py) を起動していないとLunaは返事をできません</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
